name: Release

# Push a tag like v0.2.0 to build a signed APK and publish it as a GitHub Release.
#
# One-time setup (keep the key out of git and back it up; every update must be signed with the same key):
#   keytool -genkeypair -v -keystore meshie-release.jks -alias meshie -keyalg RSA -keysize 4096 -validity 10000
# Then add repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64 = output of `base64 -w0 meshie-release.jks`, KEYSTORE_PASSWORD, KEY_ALIAS (meshie), KEY_PASSWORD
# For a local signed build, put the same values in a git-ignored keystore.properties
# (storeFile=, storePassword=, keyAlias=, keyPassword=) and run ./gradlew assembleRelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))" >> "$GITHUB_ENV"

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing (see the top of release.yml)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The default also installs "tools", which no longer exists in the SDK repository.
          packages: platform-tools

      - name: Install SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build signed APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="meshie-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "Meshie $GITHUB_REF_NAME" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f release.jks keystore.properties
